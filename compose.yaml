services:
  stock-bot:
    image: ghcr.io/chzhonge/stock-bot:latest
    restart: unless-stopped
    volumes:
      - type: bind
        source: ../stock-bot-private/config.toml
        target: /app/config.toml
        read_only: true
        bind:
          create_host_path: false
      - night-data:/app/data
    labels: &image-update-labels
      wud.watch: "true"
      wud.watch.digest: "true"
      wud.trigger.include: dockercompose.dotpricebot

  stock-bot-cron:
    image: ghcr.io/chzhonge/stock-bot:latest
    restart: unless-stopped
    environment:
      TZ: Asia/Taipei
    volumes:
      - type: bind
        source: ../stock-bot-private/config.toml
        target: /app/config.toml
        read_only: true
        bind:
          create_host_path: false
    command: ["supercronic", "-passthrough-logs", "/app/crontab"]
    labels: *image-update-labels

volumes:
  night-data:
