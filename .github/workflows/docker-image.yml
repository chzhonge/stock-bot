name: Publish Docker image

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-docker-image
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/chzhonge/dot-price-bot
    steps:
      - name: Validate release tag
        run: |
          if [[ ! $GITHUB_REF_NAME =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ || $GITHUB_REF_NAME == latest ]]; then
            echo 'Use a Docker-compatible release tag such as v0.1.0. The latest tag is reserved.' >&2
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build image
        run: |
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${IMAGE}:${GITHUB_REF_NAME}" .

      - name: Check container entry points
        run: |
          docker run --rm --network none "${IMAGE}:${GITHUB_REF_NAME}" stock-chart-bot --help
          docker run --rm --network none "${IMAGE}:${GITHUB_REF_NAME}" python -m scripts.tw_market_report --help

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        run: |
          docker push "${IMAGE}:${GITHUB_REF_NAME}"
          docker tag "${IMAGE}:${GITHUB_REF_NAME}" "${IMAGE}:latest"
          docker push "${IMAGE}:latest"
